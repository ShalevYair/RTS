<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המפקד</title>
<!-- installable (Add to Home Screen): opens full screen, like an app -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a8c97c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="המפקד">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv" data-al="map"></canvas>
  <div id="vig" aria-hidden="true"></div>
  <button id="upgBtn" class="upgBtn" hidden></button>
  <div class="razeSure micSure" id="micSure" role="alertdialog" hidden><span>🎙️</span><span data-t="micGate"></span><button id="micYes" data-t="micYes"></button><button id="micNo" data-t="micNo"></button></div>
  <div class="razeSure" id="razeSure" role="alertdialog" hidden><span id="razeQ"></span><button id="razeYes" data-t="yes"></button><button id="razeNo" data-t="no"></button></div>
  <canvas id="mini" class="glass" data-al="mini" hidden></canvas>
  <!-- under the map: the latest important messages (newest on top); a click goes there -->
  <div id="feed" class="feed" aria-live="polite"></div>
  <!-- top middle: the power bar, us against them -->
  <div class="hudc">
    <b class="pts blue" id="ptsB" data-tip="tipScore">0</b>
    <span class="heldp" id="heldB"></span>
    <div class="score blue glass" id="power"><span class="pwbar"><i id="pwB"></i></span><i class="boost" id="moon" data-tip="tipNight" hidden>🌙</i></div>
    <span class="heldp" id="heldR"></span>
    <b class="pts red" id="ptsR" data-tip="tipScore">0</b>
  </div>
  <!-- top left: the kinds of building, one under the other (dimmed with no free slot); the squad buttons only in the
       tutorial -->
  <div class="hudl">
    <div class="bcats" id="bcats" role="group"></div>
    <div class="seg glass" id="gSq" role="group">
      <button id="all" class="icon" aria-pressed="false" data-al="all" data-tip="all">★</button>
      <span id="sqs" class="seg"></span>
      <button id="grp" class="icon" hidden>🔗</button>
    </div>
  </div>
  <button id="paused" class="glass" data-al="play" data-tip="play" hidden>⏸</button>
  <ol class="log" id="log" aria-live="polite" hidden></ol>
  <div class="buildm glass" id="buildm" hidden role="menu" aria-label="🏗️"></div>
  <div class="call glass" id="call" hidden role="alertdialog" aria-live="assertive">
    <span id="callTxt"></span>
    <button id="callHold" class="icon" data-tip="tipHold" data-al="hold"></button><button id="callBack" class="icon" data-tip="tipRetreat" data-al="retreat"></button><b id="callT"></b>
  </div>
  <div class="menu glass" id="menu" hidden>
    <div class="mrow"><span data-t="speed"></span><button data-rate="0.5" data-t="slow"></button><button data-rate="1" data-t="normalRate"></button><button data-rate="2" data-t="fast"></button></div>
    <div class="mrow"><span data-t="music"></span><button id="music" class="icon" aria-pressed="true" data-al="music" data-tip="music">♪</button><input id="vol" type="range" min="0" max="100" value="35" data-al="vol"></div>
    <div class="mrow"><span data-t="radio"></span><button id="radio" class="icon" aria-pressed="true" data-al="tipRadio" data-tip="tipRadio">📻</button><small id="radioNote" class="legend"></small></div>
    <div class="mrow"><span data-t="sfx"></span><button id="sfx" class="icon" aria-pressed="true" data-al="sfx" data-tip="sfx">💥</button><input id="sfxvol" type="range" min="0" max="100" value="60" data-al="sfxVol"></div>
    <div class="mrow" id="fsRow"><span data-t="fsName"></span><button id="fs" class="icon" aria-pressed="false" data-al="fs" data-tip="fs">⛶</button></div>
    <div class="mrow"><span data-t="gfx"></span><button id="gfxHi" data-gfx="hi" data-t="gfxHi" data-tip="tipGfxHi"></button><button data-gfx="low" data-t="gfxLow" data-tip="tipGfxLow"></button></div>
    <div class="mrow"><span data-t="language"></span><button data-lang="he">עברית</button><button data-lang="en">English</button></div>
    <div class="mrow"><button id="help" data-t="help" data-tip="tipHelp"></button><button id="home" data-t="mainScreen"></button></div>
    <div class="mrow sure" id="homeSure" hidden><span data-t="sureHome"></span><button id="homeYes" data-t="yes"></button><button id="homeNo" data-t="no"></button></div>
  </div>
  <!-- the main menu: the moving picture (or the still one) over the whole screen, the map hidden; the name and
       "start" in the middle of the screen, the rest in a side panel (right in Hebrew, left in English) -->
  <div class="intro mainmenu" id="intro">
    <div class="menuBg" aria-hidden="true"><video class="menuVid" id="menuVid" muted loop playsinline preload="auto"></video></div>
    <div class="card menuHero" role="dialog" aria-labelledby="introT">
      <h1 id="introT" data-t="title"></h1>
      <p class="menuSub" data-t="menuSub"></p>
      <button id="go" data-al="go"><span id="goT" data-t="playGame"></span></button>
      <p class="turn" data-al="turn">📱↻</p>
    </div>
    <aside class="menuSide" id="menuSide">
      <div class="sideSec" id="sideMain">
        <div class="mrow"><span data-t="language"></span><button data-lang="he">עברית</button><button data-lang="en">English</button></div>
        <div id="freeOpts">
        <div class="mrow"><span data-t="fog"></span><button data-fog="1" data-t="on" data-tip="tipFogOn"></button><button data-fog="0" data-t="off" data-tip="tipFogOff"></button></div>
        <div class="mrow"><span data-t="mapSize"></span><button data-map="small" data-t="small" data-tip="tipSmall"></button><button data-map="big" data-t="big" data-tip="tipBig"></button><button data-map="huge" data-t="huge" data-tip="tipHuge"></button></div>
        <div class="mrow"><span data-t="diff"></span><button data-diff="easy"></button><button data-diff="normal"></button><button data-diff="hard"></button></div>
        <div class="mrow foeRow"><span data-t="foeStyle"></span><button data-foe="random" data-tip="foe_random">🎲</button><button data-foe="steady" data-tip="foe_steady">⚖️</button><button data-foe="missile" data-tip="foe_missile">🚀</button><button data-foe="tanks" data-tip="foe_tanks">🛡️</button><button data-foe="infantry" data-tip="foe_infantry">🪖</button><button data-foe="vehicles" data-tip="foe_vehicles">🚙</button><button data-foe="air" data-tip="foe_air">✈️</button><button data-foe="commando" data-tip="foe_commando">🗡️</button></div>
        <div class="mrow foeRow armRow"><span data-t="armsRow" data-tip="arms_tip"></span><button data-arm="armor" data-tip="arm_armor">🛡️</button><button data-arm="infantry" data-tip="arm_infantry">🪖</button><button data-arm="air" data-tip="arm_air">✈️</button><button data-arm="guns" data-tip="arm_guns">💥</button></div>
        </div>
        <div class="mrow"><span data-t="speed"></span><button data-rate="0.5" data-t="slow"></button><button data-rate="1" data-t="normalRate"></button><button data-rate="2" data-t="fast"></button></div>
        <div class="sideBtns">
          <button class="sideBtn" id="learn"><span aria-hidden="true">🎓</span><span data-t="learn"></span></button>
          <button class="sideBtn" id="wikiBtn"><span aria-hidden="true">📖</span><span data-t="wiki"></span></button>
          <button class="sideBtn" id="micBtn"><span aria-hidden="true">🎙️</span><span data-t="micAsk"></span></button>
          <button class="sideBtn" id="moreBtn" aria-expanded="false"><span aria-hidden="true">⚙</span><span data-t="more"></span></button>
          <button class="sideBtn" id="quitBtn"><span aria-hidden="true">⏻</span><span data-t="quit"></span></button>
        </div>
        <div id="moreBox" class="moreBox" hidden></div>
      </div>
      <div class="sideSec" id="sideLevels" hidden>
        <div class="sideHead"><button id="lvBack" class="icon" data-al="back">‹</button><b data-t="learn"></b></div>
        <p class="sideNote" data-t="learnNote"></p>
        <div class="levels" id="levels" role="group"></div>
      </div>
    </aside>
  </div>
  <!-- the guide: the game explained, by topic -->
  <div class="wiki" id="wiki" hidden role="dialog" aria-labelledby="wikiT">
    <div class="wikiBox">
      <div class="wikiHead"><b id="wikiT" data-t="wiki"></b><button id="wikiX" class="icon" data-al="close">✕</button></div>
      <div class="wikiBody"><nav class="wikiNav" id="wikiNav"></nav><article class="wikiText" id="wikiText"></article></div>
    </div>
  </div>
  <div class="intro" id="end" hidden>
    <div class="card glass" role="dialog" aria-labelledby="endT">
      <h1 id="endT"></h1>
      <p class="stats"><b class="me" id="endMe"></b> : <b class="foe" id="endFoe"></b> · <span id="endInfo"></span></p>
      <p class="learned" id="endLearn" hidden></p>
      <div id="replayBox" hidden>
        <canvas id="replay" data-al="replay"></canvas>
        <div class="mrow"><span id="replayT">0:00</span><input id="scrub" type="range" min="0" max="0" value="0" data-al="replayT"></div>
        <p class="legend"><span data-t="replayKey"></span> · <span id="endStats"></span></p>
      </div>
      <div class="btns"><button id="again"></button><button id="share" data-t="share"></button><button id="settings" data-t="levels"></button></div>
    </div>
  </div>
  <!-- bottom left, one above the other: the HQ to place, the forward HQ, the drone (each with a ring filling up to the
       next one) -->
  <div class="bar glass" id="bar" role="toolbar">
    <button id="mic" class="icon" aria-pressed="false" data-al="mic" data-tip="tipMic" hidden>🎙️</button>
    <button id="hqb" class="icon" data-al="hqb" data-tip="tipHqb" hidden>🏰</button>
    <button id="eye" class="icon node" aria-pressed="false" data-al="eye" data-tip="eye"><svg class="ico" viewBox="-12 -12 24 24" aria-hidden="true"><path d="M-7-7L7 7M7-7L-7 7" stroke="currentColor" stroke-width="2"/><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="-7" cy="-7" r="4.2"/><circle cx="7" cy="-7" r="4.2"/><circle cx="-7" cy="7" r="4.2"/><circle cx="7" cy="7" r="4.2"/></g><rect x="-3" y="-3" width="6" height="6" rx="1.5" fill="currentColor"/></svg><b id="eyeN"></b><i></i></button>
    <button id="bld" class="icon" aria-expanded="false" data-al="bld" data-tip="bld">🏗️<b id="slotN"></b></button>
    <button id="front" class="icon" aria-pressed="false" data-al="front" data-tip="tipFront" hidden><svg viewBox="0 0 40 48" width="34" height="40" aria-hidden="true"><path d="M9 45V4" stroke="#1b2430" stroke-width="5" stroke-linecap="round"/><path d="M9 45V4" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M9 4Q22 2 35 10L9 20Z" fill="#3b7dd8" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button id="road" class="icon" aria-pressed="false" data-al="road" data-tip="tipRoad" hidden>🛣️</button>
    <button id="fhq" class="icon node" data-al="fhq" data-tip="fhq">🏕️<b id="fhqN"></b><i></i></button>
  </div>
  <!-- bottom left: the order (sword = attack, shield = hold; a tap switches), only while something is picked -->
  <div class="grp glass" id="gOrd" role="group">
    <button class="ord icon" id="ordMode"></button>
    <button class="ord icon" id="silent" data-tip="tipSilent"></button>
  </div>
  <!-- bottom right: the settings -->
  <div class="corner" id="corner">
    <button id="gear" class="icon glass" data-al="gear" data-tip="gear" aria-expanded="false">⚙</button>
  </div>
  <!-- the end of a game: the finale drawn on the map, then (the full game) the victory / defeat video, if there is one -->
  <div class="outro" id="outro" hidden><video id="outroVid" playsinline preload="none"></video><b id="outroWord" aria-live="polite"></b><button id="outroSkip" data-al="skip">⏭</button></div>
  <div id="tourBg" hidden></div>
  <div class="tip glass" id="tip" role="tooltip" hidden><span id="tipT"></span><div class="tipNav" id="tipNav" hidden><small id="tipN"></small><button id="tipSkip"></button><button id="tipNext"></button></div></div>
</div>

<script src="js/sim/config.js"></script>
<script src="js/sim/util.js"></script>
<script src="js/sim/weather.js"></script>
<script src="js/sim/world.js"></script>
<script src="js/sim/control.js"></script>
<script src="js/sim/command.js"></script>
<script src="js/sim/terrain.js"></script>
<script src="js/sim/path.js"></script>
<script src="js/sim/squad.js"></script>
<script src="js/sim/intel.js"></script>
<script src="js/sim/structures.js"></script>
<script src="js/sim/roads.js"></script>
<script src="js/sim/fuel.js"></script>
<script src="js/sim/special.js"></script>
<script src="js/sim/posts.js"></script>
<script src="js/sim/ai.js"></script>
<script src="js/sim/levels.js"></script>
<script src="js/sim/step.js"></script>
<script src="js/ui/core.js"></script>
<script src="js/ui/lang.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/sprites.js"></script>
<script src="js/ui/tiles.js"></script>
<script src="js/ui/art.js"></script>
<script src="js/ui/ground.js"></script>
<script src="js/ui/fuelui.js"></script>
<script src="js/ui/voices.js"></script>
<script src="js/ui/audio.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/wiki.js"></script>
<script src="js/ui/input.js"></script>
<script src="js/ui/coach.js"></script>
<script src="js/ui/field.js"></script>
<script src="js/ui/roadui.js"></script>
<script src="js/ui/three3d.js"></script>
<script src="js/ui/main.js"></script>
<script src="js/ui/prof.js"></script>
</body>
</html>
